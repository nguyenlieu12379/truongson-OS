name: Deploy websites to GitHub Pages

# /espresso-vivace/ -> websites/TruongSon-demos/scrollcraft/builds/espresso-vivace (concept demo, scroll-craft)
# /delicias-cake/ -> websites/TruongSon-demos/scrollcraft/builds/delicias-cake (prospect demo, scroll-craft, noindex)
# /brazilian-taste/ -> websites/TruongSon-demos/scrollcraft/builds/brazilian-taste (prospect demo, scroll-craft, noindex)
# /pakachi-kitchen/ -> websites/TruongSon-demos/scrollcraft/builds/pakachi-kitchen (prospect demo, scroll-craft, noindex)
# /sweets-by-carla-g/ -> websites/TruongSon-demos/scrollcraft/builds/sweets-by-carla-g (prospect demo, scroll-craft, noindex)
# /gochon/ -> websites/TruongSon-demos/scrollcraft/builds/gochon (prospect demo, scroll-craft, noindex)
# /tardes-calenas/ -> websites/TruongSon-demos/scrollcraft/builds/tardes-calenas (prospect demo, scroll-craft, noindex)
# /el-salvadoreno/ -> websites/TruongSon-demos/scrollcraft/builds/el-salvadoreno (prospect demo, scroll-craft, noindex)
# /cantinho-brasileiro/ -> websites/TruongSon-demos/scrollcraft/builds/cantinho-brasileiro (prospect demo, scroll-craft, noindex)
# /cardamom/ -> websites/TruongSon-demos/scrollcraft/builds/cardamom (prospect demo, scroll-craft, noindex)
# /cb-bakery/ -> websites/TruongSon-demos/scrollcraft/builds/cb-bakery (prospect demo, scroll-craft, noindex)
# /             -> a plain list of the approved sites (no primary demo, noindex)
# Every push to main that touches these paths redeploys all sites.

on:
  push:
    branches: [main]
    paths:
      - "websites/TruongSon-demos/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # build and deploy are separate jobs (GitHub's own template): the artifact is
  # finalised when the build job ends, so deploy never races its upload
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble site
        run: |
          mkdir -p _site/espresso-vivace
          cp -R websites/TruongSon-demos/scrollcraft/builds/espresso-vivace/. _site/espresso-vivace/
          rm -rf _site/espresso-vivace/README.md _site/espresso-vivace/BRIEF.md _site/espresso-vivace/verify _site/espresso-vivace/.gitignore
          mkdir -p _site/delicias-cake
          cp -R websites/TruongSon-demos/scrollcraft/builds/delicias-cake/. _site/delicias-cake/
          rm -rf _site/delicias-cake/README.md _site/delicias-cake/BRIEF.md _site/delicias-cake/RESEARCH.md _site/delicias-cake/lab _site/delicias-cake/serve.ps1 _site/delicias-cake/assets/source/SOURCES.md
          mkdir -p _site/brazilian-taste
          cp -R websites/TruongSon-demos/scrollcraft/builds/brazilian-taste/. _site/brazilian-taste/
          rm -rf _site/brazilian-taste/README.md _site/brazilian-taste/BRIEF.md _site/brazilian-taste/PREFS.md _site/brazilian-taste/serve.ps1 _site/brazilian-taste/assets/source
          mkdir -p _site/pakachi-kitchen
          cp -R websites/TruongSon-demos/scrollcraft/builds/pakachi-kitchen/. _site/pakachi-kitchen/
          rm -rf _site/pakachi-kitchen/README.md _site/pakachi-kitchen/BRIEF.md _site/pakachi-kitchen/PREFS.md _site/pakachi-kitchen/serve.ps1 _site/pakachi-kitchen/assets/source
          mkdir -p _site/sweets-by-carla-g
          cp -R websites/TruongSon-demos/scrollcraft/builds/sweets-by-carla-g/. _site/sweets-by-carla-g/
          rm -rf _site/sweets-by-carla-g/README.md _site/sweets-by-carla-g/BRIEF.md _site/sweets-by-carla-g/PREFS.md _site/sweets-by-carla-g/serve.ps1 _site/sweets-by-carla-g/assets/source
          mkdir -p _site/gochon
          cp -R websites/TruongSon-demos/scrollcraft/builds/gochon/. _site/gochon/
          rm -rf _site/gochon/README.md _site/gochon/BRIEF.md _site/gochon/PREFS.md _site/gochon/RESEARCH.md _site/gochon/assets/source
          mkdir -p _site/tardes-calenas
          cp -R websites/TruongSon-demos/scrollcraft/builds/tardes-calenas/. _site/tardes-calenas/
          rm -rf _site/tardes-calenas/README.md _site/tardes-calenas/BRIEF.md _site/tardes-calenas/PREFS.md _site/tardes-calenas/RESEARCH.md _site/tardes-calenas/assets/source _site/tardes-calenas/lab
          mkdir -p _site/el-salvadoreno
          cp -R websites/TruongSon-demos/scrollcraft/builds/el-salvadoreno/. _site/el-salvadoreno/
          rm -rf _site/el-salvadoreno/README.md _site/el-salvadoreno/BRIEF.md _site/el-salvadoreno/PREFS.md _site/el-salvadoreno/RESEARCH.md _site/el-salvadoreno/assets/source _site/el-salvadoreno/lab
          mkdir -p _site/cantinho-brasileiro
          cp -R websites/TruongSon-demos/scrollcraft/builds/cantinho-brasileiro/. _site/cantinho-brasileiro/
          rm -rf _site/cantinho-brasileiro/README.md _site/cantinho-brasileiro/BRIEF.md _site/cantinho-brasileiro/PREFS.md _site/cantinho-brasileiro/RESEARCH.md _site/cantinho-brasileiro/assets/source _site/cantinho-brasileiro/lab
          mkdir -p _site/cardamom
          cp -R websites/TruongSon-demos/scrollcraft/builds/cardamom/. _site/cardamom/
          rm -rf _site/cardamom/README.md _site/cardamom/BRIEF.md _site/cardamom/PREFS.md _site/cardamom/RESEARCH.md _site/cardamom/assets/source _site/cardamom/lab
          mkdir -p _site/cb-bakery
          cp -R websites/TruongSon-demos/scrollcraft/builds/cb-bakery/. _site/cb-bakery/
          rm -rf _site/cb-bakery/README.md _site/cb-bakery/BRIEF.md _site/cb-bakery/PREFS.md _site/cb-bakery/RESEARCH.md _site/cb-bakery/assets/source _site/cb-bakery/lab
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex, nofollow">
          <title>Sites</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 20px;color:#1c1c1c}h1{font-size:20px}a{color:inherit}li{margin:.4em 0}</style>
          <h1>Sites</h1>
          <ul>
            <li><a href="espresso-vivace/">Espresso Vivace</a></li>
            <li><a href="delicias-cake/">Delícias Cake &amp; Bakery</a></li>
            <li><a href="brazilian-taste/">Brazilian Taste</a></li>
            <li><a href="pakachi-kitchen/">Pakachi Kitchen</a></li>
            <li><a href="sweets-by-carla-g/">Sweets by Carla G</a></li>
            <li><a href="gochon/">Gochón</a></li>
            <li><a href="tardes-calenas/">Tardes Caleñas</a></li>
            <li><a href="el-salvadoreno/">El Salvadoreño Restaurant &amp; Grill</a></li>
            <li><a href="cantinho-brasileiro/">Cantinho Brasileiro</a></li>
            <li><a href="cardamom/">Cardamom</a></li>
            <li><a href="cb-bakery/">CB Bakery</a></li>
          </ul>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
