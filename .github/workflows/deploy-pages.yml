name: Deploy websites to GitHub Pages

# /forno-notte/ -> websites/TruongSon-demos/forno-notte (3D scroll demo)
# /             -> redirects to /forno-notte/

on:
  push:
    branches: [main]
    paths:
      - "websites/TruongSon-demos/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/forno-notte
          cp -R websites/TruongSon-demos/forno-notte/. _site/forno-notte/
          rm -f _site/forno-notte/README.md
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Forno Notte</title>
          <meta http-equiv="refresh" content="0; url=forno-notte/">
          <link rel="canonical" href="forno-notte/">
          <a href="forno-notte/">Forno Notte</a>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
