name: Deploy TruongSon site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "websites/TruongSon/**"
      - ".github/workflows/deploy-truongson-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-truongson
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: websites/TruongSon
      - id: deployment
        uses: actions/deploy-pages@v4
